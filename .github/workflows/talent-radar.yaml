name: Talent Radar

# 人选动态雷达:每天 06:30 (UTC) = 北京时间 14:30 扫描 connections 页上
# 所有人选的公开主页,与上次快照比对,有实质变化时自动建 Issue 提醒。
# 无变化时静默退出,不会产生空提交/空 Issue。

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch: {}  # 支持手动触发,便于调试

permissions:
  contents: write        # 需要更新快照 data/talent-radar/snapshot.json
  issues: write         # 需要创建告警 Issue

concurrency:
  group: talent-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run radar scan
        run: python3 scripts/talent-radar/radar.py > radar-report.txt

      - name: Check for changes
        id: check
        run: |
          CHANGES=$(head -1 radar-report.txt | sed 's/CHANGES: //')
          echo "changes=$CHANGES" >> "$GITHUB_OUTPUT"
          if [ "$CHANGES" -gt 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated snapshot
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/talent-radar/snapshot.json
          git commit -m "chore(talent-radar): update snapshot [skip ci]"
          git push

      - name: Create alert issue
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🔔 Talent Radar: ${{ steps.check.outputs.changes }} 位人选主页有变化"
          content-filepath: radar-report.txt
          labels: |
            talent-radar

      - name: Push report to WeChat via ServerChan
        if: steps.check.outputs.changed == 'true'
        env:
          SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: |
          if [ -z "$SENDKEY" ]; then
            echo "[!] SERVERCHAN_SENDKEY 未配置,跳过微信推送(报告仍在 Issue 里)"
            exit 0
          fi
          # ServerChan 接口有 5 分钟缓存,标题带日期保证每天的新报告不被缓存吞掉
          TITLE="🔔 TGT 人才雷达: ${{ steps.check.outputs.changes }} 位人选有动态 ($(date +%m-%d))"
          # 去掉首行 CHANGES 计数行,去掉空行,压缩为 markdown 段落
          BODY=$(tail -n +2 radar-report.txt | sed '/^$/d' | head -c 30000)
          curl -s -X POST "https://sctapi.ftqq.com/${SENDKEY}.send" \
            --data-urlencode "title=${TITLE}" \
            --data-urlencode "desp=${BODY}" \
            --max-time 30 > /dev/null && echo "[√] 微信推送完成"
